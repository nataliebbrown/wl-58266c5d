<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Main gradient with Sophia brand colors -->
    <radialGradient id="orbGradient" cx="40%" cy="35%" r="60%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#D4A030" stop-opacity="1"/>
      <stop offset="45%" stop-color="#C2703C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9CAEA6" stop-opacity="0.8"/>
    </radialGradient>
    
    <!-- Secondary flowing gradient -->
    <radialGradient id="flowGradient" cx="60%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#9CAEA6" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#C2703C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D4A030" stop-opacity="0.3"/>
    </radialGradient>
    
    <!-- Highlight gradient -->
    <radialGradient id="highlightGradient" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Outer glow gradient -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#D4A030" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#C2703C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#9CAEA6" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Noise filter for organic texture -->
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <!-- Blur filter for soft edges -->
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glow -->
  <circle cx="100" cy="100" r="90" fill="url(#glowGradient)"/>
  
  <!-- Main orb body with noise displacement -->
  <g filter="url(#noise)">
    <circle cx="100" cy="100" r="70" fill="url(#orbGradient)"/>
  </g>
  
  <!-- Secondary color layer -->
  <circle cx="100" cy="100" r="65" fill="url(#flowGradient)" filter="url(#softBlur)" opacity="0.7">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 100 100" 
      to="360 100 100" 
      dur="20s" 
      repeatCount="indefinite"/>
  </circle>
  
  <!-- Tertiary organic shape -->
  <ellipse cx="105" cy="95" rx="45" ry="50" fill="url(#orbGradient)" opacity="0.5" filter="url(#softBlur)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="360 100 100" 
      to="0 100 100" 
      dur="15s" 
      repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Inner highlight -->
  <circle cx="100" cy="100" r="60" fill="url(#highlightGradient)"/>
  
  <!-- Top specular highlight -->
  <ellipse cx="80" cy="70" rx="25" ry="15" fill="#FFFFFF" opacity="0.35" filter="url(#softBlur)"/>
  
  <!-- Subtle rim light -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="url(#orbGradient)" stroke-width="2" opacity="0.4"/>
</svg>
